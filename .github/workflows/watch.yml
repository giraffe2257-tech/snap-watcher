name: Snap watcher

on:
  schedule:
    # Every 30 minutes (UTC). GitHub may delay scheduled runs under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: snap-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      # Carry alert state between runs so a standing deal does not
      # re-notify on every single run (see realert_after_min in config.json).
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: snap-state-${{ github.run_id }}
          restore-keys: snap-state-

      - name: Check prices
        env:
          SNAP_FORCE_CHECK: "1"
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python monitor.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: snap-state-${{ github.run_id }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_id }}
          path: monitor.log
          if-no-files-found: ignore
          retention-days: 7
