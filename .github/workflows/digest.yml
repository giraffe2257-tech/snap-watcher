name: Daily digest

# Daily heartbeat is OFF by request. Run it by hand from the Actions tab when
# you want a one-off summary; re-enable by uncommenting the schedule below.
on:
  # schedule:
  #   - cron: "7 7 * * *"   # 07:07 UTC = 08:07 London while BST is in effect
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Send digest
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python monitor.py --digest
